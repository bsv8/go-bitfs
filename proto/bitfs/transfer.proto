syntax = "proto3";

package bitfs.v1;

option go_package = "github.com/bsv8/go-bitfs/proto/bitfspb;bitfspb";

import "proto/bitfs/common.proto";

// FileQuoteV1 是卖方对一个完整 seed_hash 文件的报价，而非单个对象报价。
message FileQuoteV1 {
  bytes seed_hash = 1;
  uint64 seed_price_sat = 2;
  uint64 block_price_sat = 3;
  uint64 endblock_price_sat = 4;
  uint64 file_size = 5;
  string recommended_filename = 6;
  int64 quote_expires_at_unix = 7;
  uint32 block_count = 8;
  bytes seller_pubkey = 9;
  repeated bytes supported_arbiter_pubkeys = 10;
}

// HashGetTicketV1 是买方签发的统一取货票据。
// seed 与 block 不使用 type 字段区分：seed 的 content_index 固定为 -1，
// block 的 content_index 为从零开始的块序号。
message HashGetTicketV1 {
  string session_id = 1;
  uint64 sequence = 2;
  bytes root_seed_hash = 3;
  bytes content_hash = 4;
  int64 content_index = 5;
  uint64 expected_size = 6;
  uint64 price_sat = 7;
  bytes buyer_pubkey = 8;
  bytes seller_pubkey = 9;
  int64 expires_at_unix = 10;
  bytes buyer_signature = 11;
}

// HashDeliveryV1 是卖方针对一张 HashGetTicketV1 的二进制交付。
message HashDeliveryV1 {
  string session_id = 1;
  uint64 sequence = 2;
  bytes content_hash = 3;
  bytes payload = 4;
}

// SubmitFileQuoteResponseV1 是 buyer 接收卖方报价的响应。
message SubmitFileQuoteResponseV1 {
  bool accepted = 1;
  BitfsErrorV1 error = 2;
}

// BitfsBuyerService 是 buyer 在发现之后接收卖方报价的服务端接口。
service BitfsBuyerService {
  rpc SubmitFileQuote(FileQuoteV1) returns (SubmitFileQuoteResponseV1);
}

// BitfsSellerService 是 seller 接收票据并返回二进制交付的服务端接口。
service BitfsSellerService {
  rpc Deliver(HashGetTicketV1) returns (HashDeliveryV1);
}
