baseURL: https://bsv8.github.io/go-bitfs/
title: go-bitfs
theme: theme
themesDir: node_modules/@docsy
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true

locale: zh-cn
defaultContentLanguage: zh-cn
hasCJKLanguage: true

security:
  # doc2go emits deterministic HTML fragments from this repository's Go source.
  allowContent:
    - ^text/(html|markdown)$

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: 指南
      url: /guide/
      weight: 10
    - name: API Reference
      url: /reference/
      weight: 20
    - name: GitHub
      url: https://github.com/bsv8/go-bitfs
      weight: 30

params:
  description: BitFS v3 Go SDK 文档
  offlineSearch: true
  offlineSearchSummaryLength: 90
  offlineSearchMaxResults: 20
  copyright:
    authors: go-bitfs contributors
    from_year: 2026
  ui:
    navbar_logo: false
    showLightDarkModeMenu: true
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_search_disable: false
    breadcrumb_disable: false
    readingtime:
      enable: false
    feedback:
      enable: false
  links:
    developer:
      - name: GitHub
        url: https://github.com/bsv8/go-bitfs
        icon: fa-brands fa-github
        desc: 查看源码与提交问题

module:
  hugoVersion:
    extended: true
    min: 0.160.1
  mounts:
    - source: content
      target: content
    - source: ../docs
      target: content/guide
    - source: assets
      target: assets
    - source: static
      target: static

taxonomies:
  tag: tags
  category: categories
