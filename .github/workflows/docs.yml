name: Documentation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install site dependencies
        run: npm ci
        working-directory: website

      - name: Verify Go source
        run: |
          set -euo pipefail
          files=$(gofmt -l $(find . -path './vendor' -prune -o -name '*.go' -print))
          if [ -n "$files" ]; then
            echo "Unformatted Go files:"
            echo "$files"
            exit 1
          fi
          go test ./...

      - name: Build source-driven documentation
        run: npm run build
        working-directory: website
