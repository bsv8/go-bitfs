name: Documentation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install site dependencies
        run: npm ci
        working-directory: website

      - name: Verify Go source
        run: |
          set -euo pipefail
          files=$(gofmt -l $(find . -path './vendor' -prune -o -name '*.go' -print))
          if [ -n "$files" ]; then
            echo "Unformatted Go files:"
            echo "$files"
            exit 1
          fi
          go vet ./...
          go test ./...

      - name: Race detector over the SDK test suite
        run: go test -race ./... -count=1

      # Demo 01（报价生成）与 Demo 02 的空状态离线冒烟：0201→0205 五个命令
      # 以 DEMO_02_OFFLINE=1 从零状态完整跑通开池链，不访问任何网络。真实
      # JungleBus 资金路径仍由带 UTXO 的手工演示覆盖。
      - name: Run offline protocol demos (01, 02 offline smoke, 03–08)
        run: |
          set -euo pipefail
          cp demo/.env.example demo/.env
          # Process env wins over the .env file (demoenv is first-value-wins),
          # so exported keys override the empty placeholders in .env.example.
          # Fixed throwaway keys; never real funds.
          export SELLER_PRIVATE_KEY_HEX="1111111111111111111111111111111111111111111111111111111111111111"
          export BUYER_PRIVATE_KEY_HEX="2222222222222222222222222222222222222222222222222222222222222222"
          export ARBITER_PRIVATE_KEY_HEX="3333333333333333333333333333333333333333333333333333333333333333"
          export DEMO_02_OFFLINE=1
          # demo/file.bin is a tracked fixture; never overwrite it in CI. Point
          # FILE_PATH at a generated file under $RUNNER_TEMP instead.
          export FILE_PATH="$RUNNER_TEMP/bitfs-demo-file.bin"
          head -c $((10*1024*1024)) /dev/urandom > "$FILE_PATH"
          echo "::group::go run ./demo/01_quote/01_build_quote"
          go run ./demo/01_quote/01_build_quote >/dev/null
          echo "::endgroup::"
          echo "::group::demo 02 offline smoke (0201→0205)"
          go test ./integration/ -run TestDemo02OfflineEmptyStateSmoke -count=1 -v
          echo "::endgroup::"
          for step in 03_content_request 04_content_delivery 05_cumulative_payment 06_pool_close 07_arbitration 08_arbitration_content_retrieval; do
            echo "::group::go run ./demo/${step}/..."
            go run ./demo/${step}/...
            echo "::endgroup::"
          done

      - name: Reject retired protocol wording in current documents
        run: |
          set -euo pipefail
          go test ./docs/ -run TestCurrentDocumentsExcludeRetiredProtocol,TestExportedStructFieldsHaveChineseDocs -count=1

      - name: Build source-driven documentation
        run: npm run build
        working-directory: website
