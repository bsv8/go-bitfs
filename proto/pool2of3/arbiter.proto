syntax = "proto3";

package pool2of3.v1;

option go_package = "github.com/bsv8/go-bitfs/proto/pool2of3pb;pool2of3pb";

import "proto/pool2of3/common.proto";

// ArbitrateSessionPoolRequestV1 是仲裁方对具体费用池的终态收尾请求。
message ArbitrateSessionPoolRequestV1 {
  string spend_txid = 1;
  bool approved = 2;
  string reason = 3;
  bytes arbiter_signature = 4;
  uint64 final_payout_sat = 5;
  bytes arbiter_signature_on_close_tx = 6;
}

// ArbitrateSessionPoolResponseV1 支持两阶段 close：先返回 sighash，
// 再由仲裁方提交 close tx 签名并返回完整可广播交易。
message ArbitrateSessionPoolResponseV1 {
  bool success = 1;
  string closing_txid = 2;
  string closing_tx_hex = 3;
  string unsigned_close_tx_hex = 4;
  string closing_tx_sighash_hex = 5;
  bool needs_arbiter_signature = 6;
  PoolErrorV1 error = 7;
}
