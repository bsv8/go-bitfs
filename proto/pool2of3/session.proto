syntax = "proto3";

package pool2of3.v1;

option go_package = "github.com/bsv8/go-bitfs/proto/pool2of3pb;pool2of3pb";

import "proto/pool2of3/arbiter.proto";
import "proto/pool2of3/common.proto";

// PoolTicketRefV1 是付款层对一张 BitFS 票据的幂等引用。
message PoolTicketRefV1 {
  string spend_txid = 1;
  uint64 sequence = 2;
  bytes content_hash = 3;
  uint64 price_sat = 4;
  string ticket_id = 5;
}

message EnsureSessionPoolRequestV1 {
  bytes buyer_pubkey = 1;
  bytes seller_pubkey = 2;
  bytes arbiter_pubkey = 3;
  bytes root_seed_hash = 4;
  uint64 init_amount_sat = 5;
  int64 service_deadline_unix = 6;
}

message EnsureSessionPoolResponseV1 {
  PoolSessionRefV1 session = 1;
  PoolErrorV1 error = 2;
}

message GetSessionPoolRequestV1 { string spend_txid = 1; }
message GetSessionPoolResponseV1 {
  PoolSessionRefV1 session = 1;
  PoolErrorV1 error = 2;
}

message PrepareTicketPaymentRequestV1 {
  string spend_txid = 1;
  PoolTicketRefV1 ticket = 2;
}
message PrepareTicketPaymentResponseV1 {
  string proposal_id = 1;
  PoolErrorV1 error = 2;
}

message CommitTicketPaymentRequestV1 {
  string spend_txid = 1;
  string proposal_id = 2;
  PoolTicketRefV1 ticket = 3;
}
message CommitTicketPaymentResponseV1 {
  bool success = 1;
  PoolUpdateTxResultV1 result = 2;
  uint64 sequence_after = 3;
  uint64 server_amount_after = 4;
  uint64 client_amount_after = 5;
  PoolErrorV1 error = 6;
}

message AbortTicketPaymentRequestV1 {
  string spend_txid = 1;
  string proposal_id = 2;
  PoolTicketRefV1 ticket = 3;
  string reason = 4;
}
message AbortTicketPaymentResponseV1 {
  bool success = 1;
  PoolErrorV1 error = 2;
}

message CloseSessionPoolRequestV1 {
  string spend_txid = 1;
  string refund_address = 2;
}
message CloseSessionPoolResponseV1 {
  bool success = 1;
  string closing_txid = 2;
  string closing_tx_hex = 3;
  PoolErrorV1 error = 4;
}

// PoolSessionService 是 BitFS 正式交易使用的 2-of-3 费用池服务。
service PoolSessionService {
  rpc EnsureSessionPool(EnsureSessionPoolRequestV1) returns (EnsureSessionPoolResponseV1);
  rpc GetSessionPool(GetSessionPoolRequestV1) returns (GetSessionPoolResponseV1);
  rpc PrepareTicketPayment(PrepareTicketPaymentRequestV1) returns (PrepareTicketPaymentResponseV1);
  rpc CommitTicketPayment(CommitTicketPaymentRequestV1) returns (CommitTicketPaymentResponseV1);
  rpc AbortTicketPayment(AbortTicketPaymentRequestV1) returns (AbortTicketPaymentResponseV1);
  rpc CloseSessionPool(CloseSessionPoolRequestV1) returns (CloseSessionPoolResponseV1);
  rpc ArbitrateSessionPool(ArbitrateSessionPoolRequestV1) returns (ArbitrateSessionPoolResponseV1);
}
